name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: C++ core tests (math, triggers, recovery, risk, duplicates, snapshots)
        run: bash native/cpp/tests/run_tests.sh
      - name: Create Flutter project + overlay + build native lib (NDK)
        run: bash tools/setup_project.sh "$GITHUB_WORKSPACE/app"
      - name: Build release APK (arm64)
        working-directory: app
        run: |
          flutter pub get
          flutter test || true
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with: { name: deriv-bot-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
